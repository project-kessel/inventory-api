syntax = "proto3";

package kessel.inventory.v1beta2;

import "google/protobuf/struct.proto";
import "kessel/inventory/v1beta2/write_visibility.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/project-kessel/inventory-api/api/kessel/inventory/v1beta2";
option java_multiple_files = true;
option java_package = "org.project_kessel.api.inventory.v1beta2";

// Request to add one or more relationships to a Resource without reporting
// the complete set of relationships. Only relationship-typed fields are
// accepted; attribute fields are rejected.
message AddResourceRelationshipsRequest {
  optional string inventory_id = 1;
  string type = 2 [(buf.validate.field).string = {min_len: 1}, (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]+$"];
  string reporter_type = 3 [(buf.validate.field).string = {min_len: 1}, (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]+$"];
  string reporter_instance_id = 4 [(buf.validate.field).string = {min_len: 1}];
  string local_resource_id = 5 [(buf.validate.field).string = {min_len: 1}];
  // Partial reporter representation containing only relationship fields.
  // Merged additively into existing reporter relationships.
  // At least one of `reporter` or `common` must be provided.
  optional google.protobuf.Struct reporter = 6;
  // Partial common representation containing only relationship fields.
  // At least one of `reporter` or `common` must be provided.
  optional google.protobuf.Struct common = 7;
  oneof idempotency_key {
    string transaction_id = 8;
  }
  WriteVisibility write_visibility = 9 [(buf.validate.field).enum.defined_only = true];
}
