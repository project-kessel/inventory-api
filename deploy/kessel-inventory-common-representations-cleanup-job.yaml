apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: kessel-inventory-common-representations-cleanup-job
objects:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: ${JOB_NAME}
      labels:
        app: kessel-inventory-jobs
        job-type: common-representations-cleanup-job
    spec:
      activeDeadlineSeconds: ${{ACTIVE_DEADLINE_SECONDS}}
      backoffLimit: 0
      completions: 1
      parallelism: 1
      template:
        metadata:
          labels:
            app: kessel-inventory-jobs
            job-type: common-representations-cleanup-job
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ${JOB_NAME}
              image: ${INVENTORY_IMAGE}:${IMAGE_TAG}
              imagePullPolicy: Always
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - inventory-api
                - run-job
                - common-representations-cleanup-job
                - --keep-versions=${KEEP_VERSIONS}
                - --resource-type=${RESOURCE_TYPE}
                - --batch-size=${BATCH_SIZE}
                - --batch-delay=${BATCH_DELAY}
                - --max-batches=${MAX_BATCHES}
                - --max-duration=${MAX_DURATION}
                - --execute=${EXECUTE}
              env:
                - name: CLOWDER_ENABLED
                  value: ${CLOWDER_ENABLED}
                - name: INVENTORY_API_CONFIG
                  value: "/inventory/inventory-api-config.yaml"
                - name: INVENTORY_API_STORAGE_DATABASE
                  value: postgres
                - name: INVENTORY_API_STORAGE_POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: kessel-inventory-db
                      key: db.host
                      optional: true
                - name: INVENTORY_API_STORAGE_POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: kessel-inventory-db
                      key: db.port
                      optional: true
                - name: INVENTORY_API_STORAGE_POSTGRES_DBNAME
                  valueFrom:
                    secretKeyRef:
                      name: kessel-inventory-db
                      key: db.name
                      optional: true
                - name: INVENTORY_API_STORAGE_POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: kessel-inventory-db
                      key: db.user
                      optional: true
                - name: INVENTORY_API_STORAGE_POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kessel-inventory-db
                      key: db.password
                      optional: true
                - name: TMPDIR
                  value: /tmp
              volumeMounts:
                - name: config-volume
                  mountPath: "/inventory"
                - name: tmp
                  mountPath: "/tmp"
              resources:
                requests:
                  memory: ${REQUESTS_MEMORY}
                  cpu: ${REQUESTS_CPU}
                limits:
                  memory: ${LIMITS_MEMORY}
                  cpu: ${LIMITS_CPU}
          volumes:
            - name: config-volume
              secret:
                secretName: ${INVENTORY_API_CONFIG_NAME}
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
parameters:
  - description: Job name (e.g., common-rep-cleanup-20261016)
    name: JOB_NAME
    required: true
  - description: App Image
    name: INVENTORY_IMAGE
    value: quay.io/redhat-services-prod/project-kessel-tenant/kessel-inventory/inventory-api
  - description: Image Tag; use a unique immutable tag, never latest
    name: IMAGE_TAG
    required: true
  - description: Number of newest common representations retained per resource; must be at least 2
    name: KEEP_VERSIONS
    value: "2"
  - description: Optional resource type filter; empty means all resource types
    name: RESOURCE_TYPE
    value: ""
  - description: Enable deletion only after the runbook's operational preconditions are verified; false is a read-only preview
    name: EXECUTE
    value: "false"
  - description: Maximum common representation rows deleted per transaction
    name: BATCH_SIZE
    value: "1000"
  - description: Interruptible delay between committed batches (Go duration)
    name: BATCH_DELAY
    value: "500ms"
  - description: Maximum number of committed batches in one invocation
    name: MAX_BATCHES
    value: "1"
  - description: Maximum total invocation duration, including startup and batch delays (Go duration)
    name: MAX_DURATION
    value: "5m"
  - description: Pod deadline in seconds; must exceed MAX_DURATION plus image pull and startup margin
    name: ACTIVE_DEADLINE_SECONDS
    value: "360"
  - description: Enable Clowder integration (true/false)
    name: CLOWDER_ENABLED
    value: "true"
  - description: Name of the Inventory API Config Secret
    name: INVENTORY_API_CONFIG_NAME
    value: inventory-api-config
  - description: Memory request for job
    name: REQUESTS_MEMORY
    value: '384Mi'
  - description: CPU request for job
    name: REQUESTS_CPU
    value: '100m'
  - description: Memory limit for job
    name: LIMITS_MEMORY
    value: '512Mi'
  - description: CPU limit for job
    name: LIMITS_CPU
    value: '500m'
