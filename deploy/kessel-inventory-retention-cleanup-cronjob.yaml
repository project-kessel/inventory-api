apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: kessel-inventory-retention-cleanup-cronjob
objects:
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: retention-cleanup
      labels:
        app: kessel-inventory-jobs
        job-type: retention-cleanup
    spec:
      suspend: ${{RETENTION_CRONJOB_SUSPEND}}
      schedule: "${RETENTION_SCHEDULE}"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        metadata:
          labels:
            app: kessel-inventory-jobs
            job-type: retention-cleanup
        spec:
          backoffLimit: 2
          activeDeadlineSeconds: ${{RETENTION_JOB_TIMEOUT}}
          template:
            metadata:
              labels:
                app: kessel-inventory-jobs
                job-type: retention-cleanup
            spec:
              restartPolicy: OnFailure
              containers:
                - name: retention-cleanup
                  image: ${INVENTORY_IMAGE}:${IMAGE_TAG}
                  imagePullPolicy: Always
                  command:
                    - inventory-api
                    - run-job
                    - retention-cleanup-job
                    - --retention-days=${RETENTION_DAYS}
                    - --batch-size=${BATCH_SIZE}
                    - --batch-delay-ms=${BATCH_DELAY_MS}
                    - --reporter-type=${REPORTER_TYPE}
                  env:
                    - name: CLOWDER_ENABLED
                      value: "true"
                    - name: INVENTORY_API_CONFIG
                      value: "/inventory/inventory-api-config.yaml"
                    - name: PGDATA
                      value: /temp/data
                    - name: INVENTORY_API_STORAGE_POSTGRES_HOST
                      valueFrom:
                        secretKeyRef:
                          name: kessel-inventory-db
                          key: db.host
                          optional: true
                    - name: INVENTORY_API_STORAGE_POSTGRES_PORT
                      valueFrom:
                        secretKeyRef:
                          name: kessel-inventory-db
                          key: db.port
                          optional: true
                    - name: INVENTORY_API_STORAGE_POSTGRES_DBNAME
                      valueFrom:
                        secretKeyRef:
                          name: kessel-inventory-db
                          key: db.name
                          optional: true
                    - name: INVENTORY_API_STORAGE_POSTGRES_USER
                      valueFrom:
                        secretKeyRef:
                          name: kessel-inventory-db
                          key: db.user
                          optional: true
                    - name: INVENTORY_API_STORAGE_POSTGRES_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: kessel-inventory-db
                          key: db.password
                          optional: true
                    - name: INVENTORY_API_STORAGE_DATABASE
                      value: postgres
                  volumeMounts:
                    - name: config-volume
                      mountPath: "/inventory"
                  resources:
                    requests:
                      memory: ${REQUESTS_MEMORY}
                      cpu: ${REQUESTS_CPU}
                    limits:
                      memory: ${LIMITS_MEMORY}
                      cpu: ${LIMITS_CPU}
              volumes:
                - name: config-volume
                  secret:
                    secretName: ${INVENTORY_API_CONFIG_NAME}
parameters:
  - description: App Image
    name: INVENTORY_IMAGE
    value: quay.io/redhat-services-prod/project-kessel-tenant/kessel-inventory/inventory-api
  - description: Image Tag
    name: IMAGE_TAG
    required: true
  - description: Cron schedule (default @daily = midnight UTC)
    name: RETENTION_SCHEDULE
    value: "0 2 * * *"
  - description: Number of days to retain historical data
    name: RETENTION_DAYS
    value: "7"
  - description: Reporter type to filter by (empty = all reporters)
    name: REPORTER_TYPE
    value: ""
  - description: Number of records to delete per batch
    name: BATCH_SIZE
    value: "10000"
  - description: Delay between batches in milliseconds
    name: BATCH_DELAY_MS
    value: "500"
  - description: Suspend the retention cleanup CronJob (set to true to disable)
    name: RETENTION_CRONJOB_SUSPEND
    value: "false"
  - description: Job timeout in seconds (48 hours = 172800, 72 hours = 259200)
    name: RETENTION_JOB_TIMEOUT
    value: "172800"
  - description: Name of the Inventory API Config ConfigMap
    name: INVENTORY_API_CONFIG_NAME
    value: inventory-api-config
  - description: Memory request for job
    name: REQUESTS_MEMORY
    value: '512Mi'
  - description: CPU request for job
    name: REQUESTS_CPU
    value: '200m'
  - description: Memory limit for job
    name: LIMITS_MEMORY
    value: '1Gi'
  - description: CPU limit for job
    name: LIMITS_CPU
    value: '500m'
