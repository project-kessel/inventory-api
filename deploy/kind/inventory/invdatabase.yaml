# DEVELOPMENT ONLY — DO NOT USE IN PRODUCTION.
# This configuration disables or weakens authentication, TLS, or related security controls.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
data:
  postgresql.conf: |
    max_connections = 100
    listen_addresses = '*'
    shared_buffers = 128MB
    work_mem = 4MB
    wal_level = logical
    log_destination = 'stderr'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invdatabase
  labels:
    app: invdatabase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invdatabase
  template:
    metadata:
      labels:
        app: invdatabase
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.8
          securityContext:
            # The PostgreSQL entrypoint initializes and owns mounted data as root.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          command: [ "docker-entrypoint.sh", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
          volumeMounts:
          - name: postgres-config
            mountPath: /etc/postgresql/postgresql.conf
            subPath: postgresql.conf
          - name: postgres-data
            mountPath: /var/lib/postgresql/data
          - name: postgres-tmp
            mountPath: /tmp
          - name: postgres-run
            mountPath: /var/run/postgresql
          env:
            - name: POSTGRES_DB
              value: spicedb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-api-config
                  key: db_password
          ports:
            - containerPort: 5432
      volumes:
        - name: postgres-config
          configMap:
            name: postgres-config
        - name: postgres-data
          emptyDir: {}
        - name: postgres-tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: invdatabase
  labels:
    app: invdatabase
spec:
  ports:
    - port: 5433
      targetPort: 5432
  selector:
    app: invdatabase
  type: ClusterIP
