# DEVELOPMENT ONLY — DO NOT USE IN PRODUCTION.
# This configuration disables or weakens authentication, TLS, or related security controls.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    name: postgres
  selector:
    app: postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: postgres:17.8
        name: postgres
        # SpiceDB requires "track_commit_timestamp=on" for its watch API, which
        # underpins at_least_as_fresh consistency checks used by CheckPermission.
        args: ["-c", "track_commit_timestamp=on"]
        envFrom:
          - secretRef:
              name: postgres-credentials
        ports:
        - containerPort: 5432
          name: postgres
        securityContext:
          # The PostgreSQL entrypoint initializes and owns mounted data as root.
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-tmp
          mountPath: /tmp
        - name: postgres-run
          mountPath: /var/run/postgresql
        resources:
            limits:
              memory: 512Mi
              cpu: "1"
            requests:
              memory: 256Mi
              cpu: "0.2"
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-tmp
        emptyDir: {}
      - name: postgres-run
        emptyDir: {}
