schema_version: "unified-schema-local-test"
name: host
description: "A physical or virtual host in the inventory system"
common:
  schema:
    type: object
    properties:
      workspace_id:
        type: string
    required:
      - workspace_id
  relations:
    - name: workspace
      target: rbac/workspace
      field: workspace_id
      cardinality: one
      description: "Workspace relation"
reporters:
  - name: hbi
    description: "Host-based inventory reporter"
    schema:
      type: object
      properties:
        satellite_id:
          oneOf:
            - type: string
              format: uuid
            - type: string
              pattern: "^\\d{10}$"
            - type: "null"
        subscription_manager_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        insights_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        ansible_host:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
