schema_version: "unified-schema-local-test"
name: notifications_integration
description: "A notifications service integration"
common:
  schema:
    type: object
    properties:
      workspace_id:
        type: string
    required:
      - workspace_id
  relations:
    - name: workspace
      target: rbac/workspace
      field: workspace_id
      cardinality: one
      description: "Workspace relation"
reporters:
  - name: notifications
    description: "Notifications service reporter"
    schema:
      type: object
      properties:
        reporter_type:
          type: string
          enum:
            - NOTIFICATIONS
          description: "The type of reporter, fixed to NOTIFICATIONS for this schema."
        reporter_instance_id:
          type: string
          description: "A unique identifier for the reporter instance, such as a service account."
        local_resource_id:
          type: string
          description: "A string representing the local identifier of the resource."
      required:
        - reporter_type
        - reporter_instance_id
        - local_resource_id
    relations: []
